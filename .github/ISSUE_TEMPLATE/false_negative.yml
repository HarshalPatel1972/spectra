name: False Negative Report
description: Spectra missed a vulnerable algorithm in the code
title: "[FN] "
labels: ["false negative", "detection"]
assignees: []

body:
  - type: markdown
    attributes:
      value: "Thanks for helping us refine Spectra's detection engine! A False Negative means there is actual cryptography in your code (like an MD5 hash or RSA generation), but Spectra failed to detect it."
  - type: textarea
    id: code_snippet
    attributes:
      label: Code Snippet
      description: Please paste the exact code snippet that Spectra missed.
      placeholder: |
        // Spectra missed this:
        crypto.generate_rsa_key()
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language / File Type
      description: e.g. Go, Python, Java, YAML
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected Detection
      description: What algorithm should Spectra have detected? (e.g. RSA, SHA-1, ECDSA)
    validations:
      required: true
